name: Publish staging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run package
      - name: Retain the exact public files for promotion
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          path: .site/
          retention-days: 90
          if-no-files-found: error
      - name: Package GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site/
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Record published version
        env:
          SOURCE_SHA: ${{ github.sha }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### Staging published" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
